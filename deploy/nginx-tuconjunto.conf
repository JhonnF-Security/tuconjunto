# Nginx frente a TuConjunto — TLS termina aquí, Node solo escucha 127.0.0.1:8081
# Reemplaza tudominio.com. Este vhost inicial es SOLO puerto 80:
#   - `nginx -t` pasa en un VPS limpio (no exige certificados aún)
#   - la app queda accesible por HTTP desde el primer minuto
#   - `certbot --nginx --redirect` inyecta después el bloque SSL y convierte
#     este bloque en redirección a HTTPS automáticamente.
#
# Nota DNS: se emite para tudominio.com (apex). Para www, crea el registro y
# amplía: sudo certbot --nginx -d tudominio.com -d www.tudominio.com

server {
    listen 80;
    listen [::]:80;
    server_name tudominio.com;

    client_max_body_size 4m;   # fotos de visitantes/documentos (app admite ~2.6MB)

    # Cabeceras de seguridad las pone la APP (CSP con nonce, nosniff, XFO,
    # HSTS sobre TLS); no duplicarlas aquí para evitar cabeceras repetidas.

    # Certbot usa esta ruta para el reto HTTP-01
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Compresión para texto/JSON
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_vary on;

    # Estáticos servidos por Express, cacheados por nginx
    location ~* \.(css|js|png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        proxy_pass http://127.0.0.1:8081;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # req.secure=true => cookie Secure + HSTS en la app
        proxy_read_timeout 60s;
    }
}
